<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 Not Found | AirRush</title>
    
    <!-- Custom Favicon -->
    <link rel="icon" type="image/jpeg" href="Images/WhatsApp Image 2026-06-13 at 11.55.23.jpg">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B00',
                        secondary: '#00C2FF',
                    },
                    animation: {
                        'gradient-x': 'gradient-x 3s ease infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        :root { --bg-color: #FFFFFF; --text-color: #111827; }
        [data-theme="dark"] { --bg-color: #0A0A0A; --text-color: #FFFFFF; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s ease-out; }
    </style>
</head>
<body class="h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Glowing Background Effects -->
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-primary/10 rounded-full blur-[100px] animate-pulse z-0"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[120px] animate-pulse z-0" style="animation-delay: 2s;"></div>

    <!-- Main 404 Content -->
    <div class="container mx-auto px-4 text-center z-10 animate-fade-in">
        
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 font-semibold tracking-widest uppercase text-[10px] mb-8">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            Error 404
        </div>
        
        <h1 class="font-serif text-[120px] md:text-[200px] font-semibold text-transparent bg-clip-text bg-gradient-to-br from-primary via-[#ff913b] to-secondary animate-gradient-x leading-none mb-6 drop-shadow-xl">
            404
        </h1>
        
        <h2 class="font-serif text-3xl md:text-5xl font-semibold mb-6 leading-tight">
            Out of Bounds!
        </h2>
        
        <p class="text-lg text-[var(--text-muted)] max-w-lg mx-auto font-medium mb-10 leading-relaxed">
            Looks like you've jumped a little too high! The page you are looking for has bounced away, changed its name, or is temporarily unavailable.
        </p>

        <a href="index.html" class="inline-flex items-center justify-center gap-3 bg-primary text-white px-10 py-4 rounded-xl font-semibold text-lg hover:bg-[#E55A00] transition-all duration-300 transform hover:-translate-y-1 shadow-lg shadow-primary/20">
            <i class="fas fa-home"></i> Return to Home
        </a>
    </div>

</body>
</html>
